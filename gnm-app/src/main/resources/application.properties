# Server
quarkus.application.name=gnm-app
quarkus.http.port=8080

# Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=gnm
quarkus.datasource.password=gnmpassword
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/gnm
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/gnm
quarkus.datasource.devservices.image-name=timescale/timescaledb:latest-pg16

# Hibernate
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# Redis
quarkus.redis.hosts=redis://localhost:6379

# SmallRye JWT Configuration (local mode)
mp.jwt.verify.publickey.location=keys/publicKey.pem
mp.jwt.verify.issuer=https://gnm.local
smallrye.jwt.sign.key.location=keys/privateKey.pem
smallrye.jwt.token.cookie=jwt

# Security Path Permissions
quarkus.http.auth.permission.public.paths=/api/auth/login,/api/health,/api/vault/*,/api/proxy/*,/api/devices/*/update,/ws/terminal/*,/ws/events,/api/settings/public/oidc
quarkus.http.auth.permission.public.policy=permit

# OIDC Base Config
quarkus.oidc.tenant-enabled=false
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated

# CORS (Allow Vite development server on port 5173)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173,http://127.0.0.1:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type

# Local Auth Credentials
gnm.auth.local.username=admin
gnm.auth.local.password=admin
%test.gnm.vault.password=my_passcode

# Network Scanner Configuration
gnm.listen.interface=eth0
gnm.subnet=192.168.1.0/24,172.28.0.0/24
gnm.scan.arp-interval=30s
gnm.scan.icmp-interval=60s
gnm.fingerprint.merge-threshold=0.75

# File Logging Configuration
quarkus.log.file.enable=true
quarkus.log.file.path=../gnm.log

# Enable JNDI context factories (required for JNDI DNS context lookups)
quarkus.naming.enable-jndi=true
