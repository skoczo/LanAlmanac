# Server
quarkus.application.name=gnm-app
quarkus.http.port=8080

# Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=gnm
quarkus.datasource.password=gnmpassword
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/gnm

# Hibernate
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# Redis
quarkus.redis.hosts=redis://localhost:6379

# SmallRye JWT Configuration (local mode)
mp.jwt.verify.publickey.location=keys/publicKey.pem
mp.jwt.verify.issuer=https://gnm.local
smallrye.jwt.sign.key.location=keys/privateKey.pem

# Security Path Permissions
quarkus.http.auth.permission.public.paths=/api/auth/login,/api/health
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated

# CORS (Allow Vite development server on port 5173)
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,http://127.0.0.1:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type

# Local Auth Credentials
gnm.auth.local.username=admin
gnm.auth.local.password=admin
