version: "3.8"
services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: gnm_postgres
    environment:
      POSTGRES_USER: gnm
      POSTGRES_PASSWORD: gnmpassword
      POSTGRES_DB: gnm
    ports:
      - "5432:5432"
    volumes:
      - gnm_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gnm_redis
    ports:
      - "6379:6379"
    volumes:
      - gnm_redis_data:/data

volumes:
  gnm_pg_data:
  gnm_redis_data:
