name: Build and Push Docker Image

on:
  push:
    branches:
      - master
      - agentless-package-management
  pull_request:
    branches:
      - master
      - agentless-package-management
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup docker-compose compatibility for Testcontainers
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.29.1/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Build Testcontainer Docker Images
        run: |
          docker build -t gnm-ne-linux-server:latest -f Dockerfile.ne-linux-server .
          docker build -t gnm-ne-router-sim:latest -f Dockerfile.ne-router-sim .
          docker build -t gnm-traffic-generator:latest -f Dockerfile.traffic-generator .

      - name: Run Backend Tests & Generate Coverage
        run: ./gradlew :gnm-app:test
        continue-on-error: true

      - name: Run SonarCloud Static Analysis Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_IO_TOKEN || secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --info
        continue-on-error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'master' }}
            type=sha,format=long,enable=${{ github.ref_name == 'master' }}
            type=ref,event=branch,prefix=dev-,enable=${{ github.ref_name != 'master' }}
            type=sha,prefix=dev-,enable=${{ github.ref_name != 'master' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-pkg-worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if gnm-pkg-worker exists
        id: check_worker
        run: |
          if [ -f "gnm-pkg-worker/Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.check_worker.outputs.exists == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: gnm-pkg-worker/go.mod

      - name: Run Go vet & tests with race detector
        if: steps.check_worker.outputs.exists == 'true'
        working-directory: gnm-pkg-worker
        run: |
          go vet ./...
          go test -race -cover ./...

      - name: Set up Docker Buildx
        if: steps.check_worker.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: steps.check_worker.outputs.exists == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for pkg-worker Docker image
        if: steps.check_worker.outputs.exists == 'true'
        id: worker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-pkg-worker
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'master' }}
            type=sha,format=long,enable=${{ github.ref_name == 'master' }}
            type=ref,event=branch,prefix=dev-,enable=${{ github.ref_name != 'master' }}
            type=sha,prefix=dev-,enable=${{ github.ref_name != 'master' }}

      - name: Build and push pkg-worker Docker image
        if: steps.check_worker.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./gnm-pkg-worker
          file: ./gnm-pkg-worker/Dockerfile
          build-args: |
            WORKER_VERSION=${{ github.ref_name }}-${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.worker_meta.outputs.tags }}
          labels: ${{ steps.worker_meta.outputs.labels }}
          cache-from: type=gha,scope=pkg-worker
          cache-to: type=gha,mode=max,scope=pkg-worker
