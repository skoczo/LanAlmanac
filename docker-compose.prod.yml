version: "3.8"
services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: lanalmanac_postgres
    environment:
      POSTGRES_USER: lanalmanac
      POSTGRES_PASSWORD: lanalmanacpassword
      POSTGRES_DB: lanalmanac
    ports:
      - "5432:5432"
    volumes:
      - lanalmanac_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lanalmanac_redis
    ports:
      - "6379:6379"
    volumes:
      - lanalmanac_redis_data:/data
    restart: unless-stopped

  lanalmanac-app:
    image: ghcr.io/skoczo/lanalmanac:latest
    container_name: lanalmanac_app
    # NOTE: When network_mode is 'host', port mapping below is ignored by Docker. 
    # The application (Backend + Frontend GUI) will be available on http://localhost:8080
    ports:
      - "8787:8080"
    environment:
      - QUARKUS_HTTP_PORT=8787
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://localhost:5432/lanalmanac
      - QUARKUS_DATASOURCE_USERNAME=lanalmanac
      - QUARKUS_DATASOURCE_PASSWORD=lanalmanacpassword
      - QUARKUS_REDIS_HOSTS=redis://localhost:6379
      - GNM_AUTH_LOCAL_USERNAME=${ADMIN_USERNAME:-admin}
      - GNM_AUTH_LOCAL_PASSWORD=${ADMIN_PASSWORD:-admin}
    depends_on:
      - db
      - redis
    network_mode: host # Required for passive network packet capturing (if running on a dedicated Linux host)
    restart: unless-stopped

volumes:
  lanalmanac_pg_data:
  lanalmanac_redis_data:
