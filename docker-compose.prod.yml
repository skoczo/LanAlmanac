version: "3.8"
services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: gnm_postgres
    environment:
      POSTGRES_USER: gnm
      POSTGRES_PASSWORD: gnmpassword
      POSTGRES_DB: gnm
    ports:
      - "5432:5432"
    volumes:
      - gnm_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gnm_redis
    ports:
      - "6379:6379"
    volumes:
      - gnm_redis_data:/data
    restart: unless-stopped

  gnm-app:
    image: ghcr.io/${GITHUB_REPOSITORY:-your-username/lanalmanac}:latest
    container_name: gnm_app
    ports:
      - "8080:8080"
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://localhost:5432/gnm
      - QUARKUS_REDIS_HOSTS=redis://localhost:6379
      - GNM_AUTH_LOCAL_USERNAME=${ADMIN_USERNAME:-admin}
      - GNM_AUTH_LOCAL_PASSWORD=${ADMIN_PASSWORD:-admin}
    depends_on:
      - db
      - redis
    network_mode: host # Required for passive network packet capturing (if running on a dedicated Linux host)
    restart: unless-stopped

volumes:
  gnm_pg_data:
  gnm_redis_data:
