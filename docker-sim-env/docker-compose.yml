version: '3.8'

networks:
  gnm_public_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24
  gnm_sim_net:
    driver: bridge
    internal: true # This completely isolates the network from your external LAN/Internet
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1

volumes:
  gnm_pg_sim_data:
  gnm_redis_sim_data:

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: sim_postgres
    environment:
      POSTGRES_USER: gnm
      POSTGRES_PASSWORD: gnmpassword
      POSTGRES_DB: gnm
    mac_address: 00:50:56:00:00:02
    volumes:
      - gnm_pg_sim_data:/var/lib/postgresql/data
    networks:
      gnm_sim_net:
        ipv4_address: 172.20.0.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gnm -d gnm"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: sim_redis
    mac_address: 00:50:56:00:00:03
    volumes:
      - gnm_redis_sim_data:/data
    networks:
      gnm_sim_net:
        ipv4_address: 172.20.0.3

  gnm-app:
    build:
      context: .. # Points to the root of the project to use the main Dockerfile
      dockerfile: Dockerfile
    container_name: sim_gnm_app
    mac_address: 00:50:56:00:00:04
    dns:
      - 172.20.0.254
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://db:5432/gnm
      - QUARKUS_REDIS_HOSTS=redis://redis:6379
      - GNM_VAULT_PASSWORD=my_sim_passcode
      - GNM_SUBNET=172.20.0.0/24
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      gnm_sim_net:
        ipv4_address: 172.20.0.4

  nginx:
    image: nginx:alpine
    container_name: sim_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gnm-app
    networks:
      gnm_sim_net:
        ipv4_address: 172.20.0.5
      gnm_public_net:
    mac_address: 00:50:56:00:00:05

  # ---- OpenWRT Router (DHCP + DNS server) - must start first ----
  ne-openwrt:
    build: openwrt/
    networks:
      gnm_sim_net:
        ipv4_address: 172.20.0.254
    mac_address: 00:50:56:00:00:fe
    cap_add:
      - NET_ADMIN
      - NET_RAW
    hostname: openwrt-router

  # ---- Network Elements (use DHCP from OpenWRT) ----
  ne-ubuntu:
    build: ubuntu/
    networks:
      gnm_sim_net:
        ipv4_address: 172.20.0.11
    mac_address: 00:50:56:00:00:0b
    cap_add:
      - NET_ADMIN
    hostname: ubuntu-ne
    depends_on:
      - ne-openwrt

  ne-centos:
    build: centos/
    networks:
      gnm_sim_net:
        ipv4_address: 172.20.0.12
    mac_address: 00:50:56:00:00:0c
    cap_add:
      - NET_ADMIN
    hostname: centos-ne
    depends_on:
      - ne-openwrt

  ne-alpine:
    build: alpine/
    networks:
      gnm_sim_net:
        ipv4_address: 172.20.0.13
    mac_address: 00:50:56:00:00:0d
    cap_add:
      - NET_ADMIN
    hostname: alpine-ne
    depends_on:
      - ne-openwrt

  # ---- Android simulator (dynamic DHCP, randomized MAC) ----
  ne-android:
    build: android/
    networks:
      gnm_sim_net:
        ipv4_address: 172.20.0.50
    cap_add:
      - NET_ADMIN
    hostname: android-phone
    depends_on:
      - ne-openwrt
